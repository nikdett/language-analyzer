<!DOCTYPE HTML>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Language Analyzer</title>
  <!-- Explicit clean font import to override browser defaults -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* Strict global font overriding */
    * {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
    }

    body {
      background-color: #faf6f3;
      color: #2c2523;
      margin: 0;
      padding: 20px;
    }
    
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #fdfbf9;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    h1 {
      margin-top: 0;
      color: #2c2523;
      font-weight: 700;
      font-size: 28px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: #6b5a55;
      margin-bottom: 25px;
      font-size: 15px;
    }

    textarea {
      font-size: 15px;
      line-height: 1.6;
      background-color: #fffcfb;
      border: 1px solid #d9d0cc;
      border-radius: 10px;
      padding: 14px;
      resize: vertical;
      width: 100%;
      box-sizing: border-box;
      color: #2c2523;
    }

    .textEntry {
      display: flex;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 25px;
      padding-bottom: 25px;
      border-bottom: 1px dashed #e6deda;
      position: relative;
    }

    .yearInput {
      font-size: 15px;
      font-weight: 500;
      width: 120px;
      flex-shrink: 0;
      padding: 10px;
      border: 1px solid #d9d0cc;
      border-radius: 10px;
      background-color: #fffcfb;
      color: #2c2523;
      text-align: center;
    }

    .textAndResults {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .remove-btn {
      position: absolute;
      right: 0;
      top: -10px;
      background: none;
      border: none;
      color: #ba322a;
      font-size: 20px;
      cursor: pointer;
      padding: 5px;
    }

    .entryResults {
      margin-top: 20px;
      max-width: 500px;
    }

    .metric-title {
      font-size: 18px;
      font-weight: 700;
      margin: 0 0 10px 0;
      color: #2c2523;
      letter-spacing: -0.2px;
    }

    .progress-wrapper {
      margin-bottom: 14px;
    }

    .progress-label {
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 5px;
      color: #2c2523;
    }

    .progress-track {
      width: 100%;
      height: 10px;
      background-color: #efeae6;
      border-radius: 5px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 5px;
      transition: width 0.4s ease-out;
    }

    .fill-overall   { background-color: #736762; }
    .fill-threat    { background-color: #800000; }
    .fill-usvsthem  { background-color: #ba322a; }
    .fill-absolutist{ background-color: #d46e65; }
    .fill-anger     { background-color: #e082a6; }
    .fill-negativity{ background-color: #8c7cb8; }
    .fill-emotional { background-color: #2b3d75; }

    .button-row {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }

    button {
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary {
      background-color: #8c2f1e;
      color: white;
      border: none;
    }

    .btn-primary:hover {
      background-color: #6e2416;
    }

    .btn-secondary {
      background-color: #f0ebe8;
      color: #4a3e3b;
      border: 1px solid #d9d0cc;
    }

    .btn-secondary:hover {
      background-color: #e6deda;
    }

    #results {
      margin-top: 15px;
      font-size: 14px;
      font-weight: 600;
      color: #6b5a55;
    }

    #chartContainer {
      margin-top: 40px;
      background: #fffcfb;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #d9d0cc;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Language Analyzer</h1>
    <p class="subtitle">Paste your text here to analyze it for signs of escalating rhetoric:</p>

    <div id="textBoxes">
      <!-- Dynamic storage contents populate here -->
    </div>

    <div class="button-row">
      <button class="btn-secondary" onclick="addTextBox()">+ Add Text Box</button>
      <button class="btn-primary" onclick="analyze()">Analyze All</button>
      <button id="toggleChartBtn" class="btn-secondary" onclick="toggleChart()">Hide Chart</button>
    </div>

    <div id="results"></div>

    <div id="chartContainer">
      <canvas id="myChart" width="600" height="300"></canvas>
    </div>
  </div>

<script>
const results = [];
let myChartInstance = null;

const LEET_MAP = {
    '0': 'o', '1': 'i', 'l': 'i', '3': 'e', '4': 'a', 
    '5': 's', '7': 't', '8': 'b', '@': 'a', '$': 's',
    '!': 'i', 'x': 'x'
};

// Dictionaries
const usVSthemWords = ['barbarian', 'collaborator', 'degenerate', 'demographic', 'enemy', 'foreigner', 'globalist', 'heretic', 'immigrant', 'impure', 'infidel', 'infiltrator', 'ingroup', 'invader', 'native', 'oppressor', 'outcast', 'outsider', 'parasite', 'puppet', 'radical', 'regime', 'replacement', 'separatist', 'subversive', 'traitor', 'tribal', 'tribe', 'undesirable', 'vermin', 'xenophobia', "outsiders", "foreigners", "elites", "globalists", "establishment", "regime", "enemies", "invaders", "infiltrators", "traitors", "patriots", "replace", "destroy", "purge", "cleanse", "reclaim", "takeover", "occupation", "oppressors", "liberators", "collaborators", "puppets", "sheeple", "brainwashed", "awakened", "redpilled", "sheep", "cattle", "vermin", "parasites", "infestation", "invasion", "demographic", "replacement", "native", "pure", "impure", "corrupt", "treasonous"];
const threatWords = ['anarchist', 'anarchy', 'arson', 'barbarian', 'barbaric', 'belligerent', 'bigot', 'bigoted', 'bigotry', 'brigand', 'cabal', 'chaos', 'cowardice', 'cult', 'demagogue', 'desperado', 'extremist', 'faction', 'fanatic', 'fanaticism', 'fascism', 'fascist', 'fundamentalism', 'fundamentalist', 'gang', 'gangster', 'illegal', 'insurgent', 'intolerance', 'lawlessness', 'mafia', 'militant', 'militia', 'mob', 'mobster', 'mutiny', 'nazi', 'nazism', 'outlaw', 'persecutor', 'pillage', 'plunder', 'rabble', 'racketeer', 'reactionary', 'rebel', 'ringleader', 'sabotage', 'sedition', 'totalitarian', 'trafficker', 'treason', 'tyrant', 'tyranny', 'vandal', 'vendetta', 'villain', 'villainous', 'warlord', 'wrongdoer', 'ambush', 'annihilate', 'annihilated', 'armed', 'assassin', 'assassinate', 'assassination', 'attack', 'attacking', 'bomb', 'bombard', 'bombardment', 'bomber', 'combat', 'combatant', 'combative', 'destroyed', 'destroyer', 'destroying', 'explode', 'exterminate', 'fire', 'firearms', 'grenade', 'gun', 'gunpowder', 'hanging', 'hangman', 'hostage', 'invade', 'invader', 'kidnap', 'kill', 'killing', 'lynch', 'manslaughter', 'massacre', 'missile', 'murder', 'murderer', 'murderous', 'poison', 'poisoned', 'poisonous', 'purge', 'raid', 'rifle', 'shoot', 'shooter', 'shooting', 'slaughter', 'slaughterhouse', 'slaughtering', 'stab', 'strangle', 'terror', 'terrorism', 'terrorist', 'terrorize', 'threat', 'threaten', 'threatening', 'torture', 'war', 'warfare', 'warlike', 'warrior', 'wildfire'];
const absolutistWords = ['always', 'never', 'every', 'all', 'none', 'nothing', 'everything', 'nobody', 'everyone', 'forever', 'eternal', 'inevitable', 'undeniable', 'indisputable', 'unquestionable', 'irrefutable', 'absolute', 'absolutely', 'totally', 'completely', 'utterly', 'purely', 'solely', 'only', 'must', 'cannot', 'impossible', 'certain', 'certainly', 'definite', 'definitely', 'guaranteed', 'unconditional', 'unconditionally', 'invariably', 'without exception', 'no question', 'beyond doubt', 'plain and simple', 'period', 'full stop', 'end of story', 'that is that', 'no debate', 'fact', 'proven', 'obvious', 'clearly', 'simply', 'just', 'real', 'true', 'false', 'wrong', 'right', 'pure', 'corrupt', 'ultimate', 'final', 'total', 'radical', 'extreme', 'existential', 'fundamental', 'core', 'essential', 'critical', 'decisive', 'supreme', 'dominant', 'inferior', 'superior', 'weak', 'strong', 'coward', 'hero', 'traitor', 'patriot', 'winner', 'loser', 'good', 'evil', 'light', 'darkness'];
const angryWords = ['belligerent', 'bigot', 'bigoted', 'coward', 'cowardly', 'craven', 'deceitful', 'degenerate', 'despicable', 'devious', 'dishonest', 'fanatical', 'fraudster', 'fury', 'greed', 'greedy', 'hateful', 'heinous', 'hostile', 'hubris', 'hypocrite', 'hypocritical', 'idiotic', 'immoral', 'insolent', 'irate', 'irascible', 'jealous', 'livid', 'loathsome', 'malicious', 'malevolent', 'menacing', 'narcissist', 'narcishistic', 'overbearing', 'paranoid', 'pompous', 'presumptuous', 'pretentious', 'raging', 'resentful', 'ruthless', 'savage', 'scheming', 'scoundrel', 'selfish', 'sinister', 'spiteful', 'treacherous', 'vicious', 'vindictive', 'wrath', 'wrathful'];
const negativeWords = ['abnormal', 'appalling', 'atrocious', 'awful', 'barbarism', 'brutal', 'brutality', 'corrupt', 'corruption', 'cowardice', 'criminal', 'cruel', 'cruelty', 'damaging', 'dangerous', 'deadly', 'decit', 'deceptive', 'deplorable', 'depraved', 'destructive', 'deviant', 'diabolic', 'diabolical', 'disgraceful', 'dishonest', 'disreputable', 'dreadful', 'evil', 'failure', 'fake', 'falsehood', 'fatal', 'filthy', 'fraud', 'fraudulent', 'ghastly', 'grim', 'harmful', 'hideous', 'horrendous', 'horrific', 'hostile', 'ignorant', 'immoral', 'incompetent', 'infamous', 'injustice', 'menacing', 'misleading', 'monstrous', 'nefarious', 'offensive', 'oppressive', 'outrageous', 'pathetic', 'poisonous', 'reckless', 'reprehensible', 'revolting', 'rotten', 'shameful', 'sinister', 'toxic', 'treacherous', 'ugly', 'unethical', 'unjust', 'untrustworthy', 'vicious', 'vile', 'violent', 'wicked', 'worthless', 'departed', 'departure'];
const emotionalChargeWords = [...new Set([...angryWords, ...negativeWords, 'fury', 'hatred', 'rage', 'crisis', 'outrage'])];

function normalizeText(text) {
    let cleaned = text.toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "") 
        .replace(/[.\-_*|/(),?!;:]/g, "");     
    
    let normalized = "";
    for (let char of cleaned) {
        normalized += LEET_MAP[char] || char;
    }
    return normalized;
}

function getLevenshteinDistance(s1, s2) {
    if (s1.length < s2.length) return getLevenshteinDistance(s2, s1);
    if (s2.length === 0) return s1.length;

    let previousRow = Array.from({ length: s2.length + 1 }, (_, i) => i);
    
    for (let i = 0; i < s1.length; i++) {
        let currentRow = [i + 1];
        for (let j = 0; j < s2.length; j++) {
            let insertions = previousRow[j + 1] + 1;
            let deletions = currentRow[j] + 1;
            let substitutions = previousRow[j] + (s1[i] !== s2[j] ? 1 : 0);
            currentRow.push(Math.min(insertions, deletions, substitutions));
        }
        previousRow = currentRow;
    }
    return previousRow[previousRow.length - 1];
}

function detectWordsAdvanced(cleanWords, wordList, maxDistance = 1) {
    let score = 0;
    for (const word of cleanWords) {
        for (const target of wordList) {
            if (getLevenshteinDistance(word, target) <= maxDistance) {
                score++;
                break; 
            }
        }
    }
    return score;
}

// Local Storage Handlers
function saveToStorage() {
    const dataToSave = [];
    const entries = document.querySelectorAll(".textEntry");
    entries.forEach(entry => {
        const textVal = entry.querySelector(".inputText").value;
        const yearVal = entry.querySelector(".yearInput").value;
        dataToSave.push({ text: textVal, year: yearVal });
    });
    localStorage.setItem("rhetoricAnalyzerData", JSON.stringify(dataToSave));
}

function loadFromStorage() {
    const wrapper = document.getElementById("textBoxes");
    wrapper.innerHTML = "";
    const stored = localStorage.getItem("rhetoricAnalyzerData");
    if (stored) {
        const parsed = JSON.parse(stored);
        if (parsed.length > 0) {
            parsed.forEach(item => addTextBox(item.text, item.year));
            return;
        }
    }
    addTextBox("", ""); 
}

function addTextBox(initialText = "", initialYear = "") {
    const wrapper = document.getElementById("textBoxes");
    const newEntry = document.createElement("div");
    newEntry.className = "textEntry";
    newEntry.innerHTML = `
        <button class="remove-btn" onclick="removeTextBox(this)">×</button>
        <input type="number" class="yearInput" placeholder="Year" min="1900" value="${initialYear}" oninput="saveToStorage()">
        <div class="textAndResults">
          <textarea class="inputText" rows="5" placeholder=" " oninput="saveToStorage()">${initialText}</textarea>
          <div class="entryResults"></div>
        </div>
    `;
    wrapper.appendChild(newEntry);
    saveToStorage();
}

function removeTextBox(btn) {
    btn.parentElement.remove();
    saveToStorage();
}

function toggleChart() {
    const chartDiv = document.getElementById("chartContainer");
    const btn = document.getElementById("toggleChartBtn");
    if (chartDiv.style.display === "none") {
        chartDiv.style.display = "block";
        btn.textContent = "Hide Chart";
    } else {
        chartDiv.style.display = "none";
        btn.textContent = "Show Chart";
    }
}

function updateChartVisuals(analysisResults) {
    const ctx = document.getElementById('myChart').getContext('2d');
    
    analysisResults.sort((a, b) => Number(a.year) - Number(b.year));
    const labels = analysisResults.map(r => `Year ${r.year}`);
    
    if (myChartInstance) {
        myChartInstance.destroy();
    }

    myChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [
                { label: 'Overall Level', data: analysisResults.map(r => r.overall), borderColor: '#736762', backgroundColor: 'transparent', tension: 0.1, borderWidth: 3 },
                { label: 'Threat', data: analysisResults.map(r => r.threat), borderColor: '#800000', backgroundColor: 'transparent', tension: 0.1, borderWidth: 3 },
                { label: 'Us vs Them', data: analysisResults.map(r => r.usVsThem), borderColor: '#ba322a', backgroundColor: 'transparent', tension: 0.1, borderWidth: 3 },
                { label: 'Absolutist', data: analysisResults.map(r => r.absolutist), borderColor: '#d46e65', backgroundColor: 'transparent', tension: 0.1, borderWidth: 3 },
                { label: 'Anger', data: analysisResults.map(r => r.angry), borderColor: '#e082a6', backgroundColor: 'transparent', tension: 0.1, borderWidth: 3 },
                { label: 'Negativity', data: analysisResults.map(r => r.negative), borderColor: '#8c7cb8', backgroundColor: 'transparent', tension: 0.1, borderWidth: 3 },
                { label: 'Emotional Charge', data: analysisResults.map(r => r.emotionalCharge), borderColor: '#2b3d75', backgroundColor: 'transparent', tension: 0.1, borderWidth: 3 }
            ]
        },
        options: {
            responsive: true,
            scales: { y: { beginAtZero: true, max: 100 } }
        }
    });
}

function analyze() {
    results.length = 0;
    const entries = document.querySelectorAll(".textEntry");

    entries.forEach(entry => {
        const textElement = entry.querySelector(".inputText");
        const yearElement = entry.querySelector(".yearInput");
        const resultsDisplay = entry.querySelector(".entryResults");

        if (!textElement) return;

        const text = textElement.value;
        const year = yearElement ? yearElement.value || "0" : "0";

        if (!text || text.trim() === "") return;

        const normalizedText = normalizeText(text);
        const cleanWords = normalizedText.split(/\s+/).filter(w => w.length > 0);
        const totalW = Math.max(cleanWords.length, 1);

        const usVsThemScore = detectWordsAdvanced(cleanWords, usVSthemWords, 1);
        const threatScore = detectWordsAdvanced(cleanWords, threatWords, 1);
        const absolutistScore = detectWordsAdvanced(cleanWords, absolutistWords, 0); 
        const angryScore = detectWordsAdvanced(cleanWords, angryWords, 1);
        const negativeScore = detectWordsAdvanced(cleanWords, negativeWords, 1);
        const emotionalScore = detectWordsAdvanced(cleanWords, emotionalChargeWords, 1);

        const pThreat = Math.min(((threatScore / totalW) * 100) * 4.5, 100).toFixed(1);
        const pUsVsThem = Math.min(((usVsThemScore / totalW) * 100) * 4.0, 100).toFixed(1);
        const pAbsolutist = Math.min(((absolutistScore / totalW) * 100) * 2.5, 100).toFixed(1);
        const pAnger = Math.min(((angryScore / totalW) * 100) * 5.0, 100).toFixed(1);
        const pNegativity = Math.min(((negativeScore / totalW) * 100) * 3.5, 100).toFixed(1);
        const pEmotional = Math.min(((emotionalScore / totalW) * 100) * 3.0, 100).toFixed(1);
        
        const pOverall = ((parseFloat(pThreat) + parseFloat(pUsVsThem) + parseFloat(pAbsolutist) + parseFloat(pAnger) + parseFloat(pNegativity) + parseFloat(pEmotional)) / 6).toFixed(1);

        if (resultsDisplay) {
            resultsDisplay.innerHTML = `
                <div class="metric-title">Overall Threat Level: ${pOverall}%</div>
                <div class="progress-wrapper">
                    <div class="progress-track"><div class="progress-fill fill-overall" style="width: ${pOverall}%"></div></div>
                </div>
                
                <div class="progress-wrapper">
                    <div class="progress-label">Threat</div>
                    <div class="progress-track"><div class="progress-fill fill-threat" style="width: ${pThreat}%"></div></div>
                </div>

                <div class="progress-wrapper">
                    <div class="progress-label">Us vs Them</div>
                    <div class="progress-track"><div class="progress-fill fill-usvsthem" style="width: ${pUsVsThem}%"></div></div>
                </div>

                <div class="progress-wrapper">
                    <div class="progress-label">Absolutist</div>
                    <div class="progress-track"><div class="progress-fill fill-absolutist" style="width: ${pAbsolutist}%"></div></div>
                </div>

                <div class="progress-wrapper">
                    <div class="progress-label">Anger</div>
                    <div class="progress-track"><div class="progress-fill fill-anger" style="width: ${pAnger}%"></div></div>
                </div>

                <div class="progress-wrapper">
                    <div class="progress-label">Negativity</div>
                    <div class="progress-track"><div class="progress-fill fill-negativity" style="width: ${pNegativity}%"></div></div>
                </div>

                <div class="progress-wrapper">
                    <div class="progress-label">Emotional Charge</div>
                    <div class="progress-track"><div class="progress-fill fill-emotional" style="width: ${pEmotional}%"></div></div>
                </div>
            `;
        }

        results.push({
            year: Number(year),
            overall: parseFloat(pOverall),
            threat: parseFloat(pThreat),
            usVsThem: parseFloat(pUsVsThem),
            absolutist: parseFloat(pAbsolutist),
            angry: parseFloat(pAnger),
            negative: parseFloat(pNegativity),
            emotionalCharge: parseFloat(pEmotional)
        });
    });

    document.getElementById("results").innerText = `Analyzed ${results.length} entries.`;

    if (results.length > 0) {
        updateChartVisuals(results);
    }
}

window.onload = function() {
    loadFromStorage();
};
</script>
</body>
</html>
